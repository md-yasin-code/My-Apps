name: Flutter checks and Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android wrapper if needed
        run: flutter create . --platforms=android --org com.mohammadyasin
      - name: Install dependencies
        run: flutter pub get
      - name: Format
        run: dart format .
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-bangla-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error