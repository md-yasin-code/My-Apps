name: Flutter checks and Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify committed Android project and Firebase identity
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -x android/gradlew
          test -f android/app/src/main/kotlin/com/deutschbangla/MainActivity.kt
          cmp -s config/firebase/google-services.json android/app/google-services.json
          grep -q 'namespace = "com.deutschbangla"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.deutschbangla"' android/app/build.gradle.kts
          grep -q 'com.google.gms.google-services' android/settings.gradle.kts
          grep -q 'com.google.firebase.crashlytics' android/settings.gradle.kts
          grep -q 'com.google.gms.google-services' android/app/build.gradle.kts
          grep -q 'com.google.firebase.crashlytics' android/app/build.gradle.kts
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path("android/app/google-services.json").read_text())
          assert cfg["project_info"]["project_id"]=="deutsch-bangla"
          assert any(c.get("client_info",{}).get("android_client_info",{}).get("package_name")=="com.deutschbangla" for c in cfg.get("client",[]))
          print("Existing Firebase project and Android app verified.")
          PY
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Generate launcher icons from assets/logo.png
        run: dart run flutter_launcher_icons
      - name: Validate spreadsheet vocabulary source
        run: |
          python3 tool/generate_vocabulary.py
          git diff --exit-code -- lib/data/spreadsheet_vocabulary.dart
      - name: Verify Dart formatting
        run: |
          dart format .
          git diff --check
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-bangla-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
