name: Flutter checks and Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android wrapper if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.mohammadyasin
          fi
      - name: Configure Google Services for Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()
          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.5.0" apply false',
                  1,
              )
              settings.write_text(text)

          app_gradle = Path("android/app/build.gradle.kts")
          text = app_gradle.read_text()
          text = re.sub(r'applicationId = "[^"]+"', 'applicationId = "com.deutschbangla"', text, count=1)
          text = re.sub(r'namespace = "[^"]+"', 'namespace = "com.deutschbangla"', text, count=1)
          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1,
              )
              app_gradle.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              xml = manifest.read_text()
              xml, count = re.subn(
                  r'android:label="[^"]*"',
                  'android:label="Deutsch Bangla"',
                  xml,
                  count=1,
              )
              if count == 0:
                  xml = xml.replace(
                      "<application",
                      '<application android:label="Deutsch Bangla"',
                      1,
                  )
              manifest.write_text(xml)
          PY
          mkdir -p android/app
          cp config/firebase/google-services.json android/app/google-services.json
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android launcher icon from assets/logo.png
        run: dart run flutter_launcher_icons
      - name: Validate and generate spreadsheet vocabulary
        run: |
          python3 tool/generate_vocabulary.py
          git diff --exit-code -- lib/data/spreadsheet_vocabulary.dart
      - name: Format
        run: dart format .
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-bangla-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
