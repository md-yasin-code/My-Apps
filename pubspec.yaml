name: deutsch_bangla
description: Offline German learning app for Bengali speakers (A1-B2).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  provider: ^6.1.2
  flutter_tts: ^4.2.3
  firebase_core: ^3.15.2
  firebase_crashlytics: ^4.3.10
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#F5F8F7"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21
